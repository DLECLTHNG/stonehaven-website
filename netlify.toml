# Netlify deploy config. The build step strips internal docs from the
# published site — they stay in git but must not be served on
# stonehavencre.com. `downloads` holds withdrawn, unreviewed PDF assets
# (fake phone, direct-lender claims, unsourced rates) — never publish.
# The grep is a release gate: build fails if any rendered HTML contains
# a sentinel token, a placeholder phone, config-gap artifacts ("Call ,"
# / "Llame al ,"), or direct-lender role claims in either language.
[build]
  publish = "."
  command = "rm -rf README.md SEO-CHANGES.md POST-LAUNCH-SEO-CHECKLIST.md netlify.toml docs tests scripts downloads && ! grep -rlE 'STONEHAVEN_OWNER_FACT_REQUIRED|555-0100|Call ,|call  to|Llame al ,|Llame al  |is a commercial real estate lender|prestamos de forma directa|[Gg]uaranteed approval|[Ll]owest rate|[Ee]veryone qualifies' --include='*.html' ."

# NOTE: response headers are NOT declared here. The build command above
# deletes netlify.toml, so a [[headers]] block in this file never reaches the
# deploy and silently does nothing. All headers live in the `_headers` file,
# which is read from the publish directory and survives the build, the same
# way `_redirects` does. Add headers there, not here.
