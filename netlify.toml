# Static output is an explicit allowlist. Internal sources, dependencies and
# withdrawn downloads stay outside the published directory.
[build]
  publish = ".site"
  command = "node scripts/check-site.mjs && node scripts/build-public.mjs"

# Response headers remain in _headers, copied into the public output.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfkit"]
  included_files = ["netlify/functions/lib/fonts/**"]
