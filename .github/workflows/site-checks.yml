name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned server dependencies
        run: npm ci --ignore-scripts
      - name: Tests and content checks
        run: node scripts/check-site.mjs
      - name: Verify generated pages match their sources
        run: |
          node scripts/build-heloc-application.mjs
          python3 scripts/build-family-lps.py
          python3 scripts/build-dscr-personas.py
          python3 scripts/build-heloc-personas.py
          python3 scripts/build-heloc-ads.py
          python3 scripts/build-seo-resources.py
          python3 scripts/build-heloc-growth.py
          python3 scripts/build-bank-statement.py
          python3 scripts/build-interest-only.py
          python3 scripts/build-cre-financing.py
          python3 scripts/build-cre-local.py
          python3 scripts/build-small-multifamily.py
          python3 scripts/build-architect-financing.py
          python3 scripts/build-investor-guides.py
          python3 scripts/build-search-navigation.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
