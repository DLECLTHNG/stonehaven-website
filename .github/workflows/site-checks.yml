name: Site checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and content checks
        run: node scripts/check-site.mjs
      - name: Verify generated pages match their sources
        run: |
          python3 scripts/build-family-lps.py
          python3 scripts/build-dscr-personas.py
          python3 scripts/build-heloc-personas.py
          python3 scripts/build-heloc-ads.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
